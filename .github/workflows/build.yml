name: Build

on:
  push:
    branches:
      - main
      - gh-pages

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest

    env:
      SONAR_TOKEN: sqp_d7f375c711b093e59fa14789f1c854fd5f237838
      SONAR_HOST_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Sonar configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("$env:SONAR_TOKEN")) {
            throw "Missing SONAR_TOKEN."
          }
          if ([string]::IsNullOrWhiteSpace("$env:SONAR_HOST_URL")) {
            throw "Missing SONAR_HOST_URL."
          }
          Write-Host "Using SonarQube URL: $env:SONAR_HOST_URL"

      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: sqp_5c7478381902ddfed4a477faf844fa0934d070ca
          SONAR_HOST_URL: http://localhost:9000
